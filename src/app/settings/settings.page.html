<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Settings</ion-title>
    </ion-toolbar>
  </ion-header>

  <section>
    <ion-list>
      <ion-item>
        <ion-label>
          <h2>{{ appName }}</h2>
          <p>Version {{ appVersion }}</p>
        </ion-label>
      </ion-item>
      <ion-item>
        <ion-label>
          <h2>Built with</h2>
          <p>Ionic, Angular, and Capacitor.</p>
        </ion-label>
      </ion-item>
    </ion-list>
  </section>

  <section>
    <ion-list>
      <ion-item lines="none">
        <ion-label>
          <h2>Camera</h2>
          <p>Used only when you take a receipt photo. You can pick from the gallery instead.</p>
        </ion-label>
      </ion-item>
    </ion-list>
  </section>

  <section id="danger-zone">
    <ion-button [disabled]="wiping()" (click)="confirmSampleData()"> Load sample data </ion-button>
    <ion-button color="danger" [disabled]="wiping()" (click)="confirmWipe()"> Clear All Data </ion-button>
  </section>
</ion-content>
